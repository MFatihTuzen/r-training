<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="title desc"><title id="title">JOIN türlerinde kayıtların korunması</title><desc id="desc">Solda A ve B tabloları; eşleşen kodlar B ve C. Sol, iç, tam ve anti birleştirme çıktılarının hangi kodları koruduğu tabloyla gösterilir.</desc><style>text{font-family:Arial,sans-serif;fill:#243348}.head{font-weight:700;font-size:18px}.small{font-size:15px}.lab{font-size:20px;font-weight:700}.cell{fill:#f5f8fc;stroke:#a7bfd1;stroke-width:1}.blue{fill:#deefff;stroke:#4e86b7;stroke-width:1.5}.green{fill:#e0f4e7;stroke:#41966b;stroke-width:1.5}</style><text x="30" y="32" class="head">Örnek: A ve B tablolarındaki anahtarlar</text><rect x="35" y="55" width="160" height="135" rx="9" class="blue"/><text x="52" y="84" class="lab">A (sol)</text><text x="52" y="112" class="small">A, B, C</text><text x="52" y="148" class="small">3 satır</text><rect x="220" y="55" width="160" height="135" rx="9" class="green"/><text x="238" y="84" class="lab">B (sağ)</text><text x="238" y="112" class="small">B, C, D</text><text x="238" y="148" class="small">3 satır</text><text x="425" y="86" class="small">Eşleşen anahtarlar: B, C</text><text x="425" y="122" class="small">Eşleşmeyenler: A ve D</text><text x="30" y="233" class="head">Birleştirme türü</text><text x="330" y="233" class="head">Çıktı anahtarları</text><text x="655" y="233" class="head">Yorum</text><rect x="28" y="247" width="815" height="43" rx="6" class="cell"/><text x="43" y="274" class="small">left_join</text><text x="345" y="274" class="small">A, B, C</text><text x="655" y="274" class="small">A korunur</text><rect x="28" y="295" width="815" height="43" rx="6" class="cell"/><text x="43" y="322" class="small">inner_join</text><text x="345" y="322" class="small">B, C</text><text x="655" y="322" class="small">Yalnız eşleşen</text><rect x="28" y="343" width="815" height="43" rx="6" class="cell"/><text x="43" y="370" class="small">full_join</text><text x="345" y="370" class="small">A, B, C, D</text><text x="655" y="370" class="small">Tüm anahtarlar</text><rect x="28" y="391" width="815" height="43" rx="6" class="cell"/><text x="43" y="418" class="small">anti_join(A,B)</text><text x="345" y="418" class="small">A</text><text x="655" y="418" class="small">Yalnız eşleşmeyen A</text></svg>